<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" opacity="0.3"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Pulsing Cyan Gradient -->
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Accent Purple Gradient -->
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="350" fill="url(#bgGrad)" rx="12" />
  <rect width="1200" height="350" fill="url(#grid)" rx="12" />

  <!-- DYNAMIC / ANIMATED BACKGROUND ELEMENTS (Behind text) -->
  <!-- Floating Orbit Curves -->
  <path d="M -100 280 Q 300 80 700 260 T 1300 100" fill="none" stroke="url(#cyanGlow)" stroke-width="2" opacity="0.4">
    <animate attributeName="d" dur="10s" repeatCount="indefinite"
             values="M -100 280 Q 300 80 700 260 T 1300 100;
                     M -100 200 Q 400 320 800 120 T 1300 220;
                     M -100 280 Q 300 80 700 260 T 1300 100" />
  </path>

  <path d="M -50 80 Q 400 300 850 100 T 1250 280" fill="none" stroke="url(#purpleGlow)" stroke-width="1.5" opacity="0.35">
    <animate attributeName="d" dur="14s" repeatCount="indefinite"
             values="M -50 80 Q 400 300 850 100 T 1250 280;
                     M -50 150 Q 300 40 750 280 T 1250 120;
                     M -50 80 Q 400 300 850 100 T 1250 280" />
  </path>

  <!-- Pulsing Network Nodes in Background -->
  <g opacity="0.5">
    <!-- Node 1 -->
    <circle cx="150" cy="90" r="6" fill="#38bdf8" filter="url(#glow)">
      <animate attributeName="r" values="4;8;4" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="3s" repeatCount="indefinite"/>
    </circle>
    <!-- Node 2 -->
    <circle cx="1050" cy="260" r="7" fill="#818cf8" filter="url(#glow)">
      <animate attributeName="r" values="5;9;5" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;1;0.4" dur="4s" repeatCount="indefinite"/>
    </circle>
    <!-- Node 3 -->
    <circle cx="980" cy="80" r="5" fill="#c084fc" filter="url(#glow)">
      <animate attributeName="r" values="3;7;3" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <!-- Node 4 -->
    <circle cx="200" cy="270" r="5" fill="#34d399" filter="url(#glow)">
      <animate attributeName="r" values="3;7;3" dur="4.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Foreground Pill / Badge Backgrounds behind text for clear contrast -->
  <rect x="360" y="45" width="480" height="34" rx="17" fill="#1e293b" fill-opacity="0.8" stroke="#3b82f6" stroke-width="1" />
  <text x="600" y="67" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" letter-spacing="1.5">
    GLOBAL NETWORK ORCHESTRATION &amp; SASE
  </text>

  <!-- MAIN TITLE (ALWAYS IN FOREGROUND & LEGIBLE) -->
  <text x="600" y="145" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="800" filter="url(#glow)">
    Cloud Wide Area Network (Cloud WAN)
  </text>

  <!-- SUBTITLE -->
  <text x="600" y="195" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400">
    Curated Enterprise SaaS Platforms &amp; Open-Source SD-WAN Solutions
  </text>

  <!-- FEATURE TAG PILLS IN FOREGROUND -->
  <g transform="translate(600, 245)">
    <!-- Tag 1 -->
    <g transform="translate(-330, 0)">
      <rect x="0" y="0" width="150" height="32" rx="16" fill="#0f172a" fill-opacity="0.9" stroke="#06b6d4" stroke-width="1.5"/>
      <text x="75" y="21" text-anchor="middle" fill="#22d3ee" font-family="sans-serif" font-size="13" font-weight="600">🌐 AWS / Azure WAN</text>
    </g>
    <!-- Tag 2 -->
    <g transform="translate(-165, 0)">
      <rect x="0" y="0" width="150" height="32" rx="16" fill="#0f172a" fill-opacity="0.9" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="75" y="21" text-anchor="middle" fill="#60a5fa" font-family="sans-serif" font-size="13" font-weight="600">⚡ SASE &amp; SD-WAN</text>
    </g>
    <!-- Tag 3 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="165" height="32" rx="16" fill="#0f172a" fill-opacity="0.9" stroke="#a855f7" stroke-width="1.5"/>
      <text x="82.5" y="21" text-anchor="middle" fill="#c084fc" font-family="sans-serif" font-size="13" font-weight="600">🛡️ WireGuard &amp; DPDK</text>
    </g>
    <!-- Tag 4 -->
    <g transform="translate(180, 0)">
      <rect x="0" y="0" width="150" height="32" rx="16" fill="#0f172a" fill-opacity="0.9" stroke="#ec4899" stroke-width="1.5"/>
      <text x="75" y="21" text-anchor="middle" fill="#f472b6" font-family="sans-serif" font-size="13" font-weight="600">🔓 Open-Source WAN</text>
    </g>
  </g>
</svg>
